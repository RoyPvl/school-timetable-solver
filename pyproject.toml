[project]
name = "school-timetable-solver"
version = "0.1.0"
description = "Excel-driven school timetable solver using OR-Tools CP-SAT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "ortools>=9.14.6206",
]

[project.scripts]
school-timetable-migrate-v2 = "school_timetable_solver.migrate_input_v2:main"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/school_timetable_solver"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/school_timetable_solver/adapter/excel_input_v2_adapter.py" = ["I001", "RUF001", "RUF012", "F841"]
"src/school_timetable_solver/adapter/excel_input_v2_reference_adapter.py" = ["F401"]
"src/school_timetable_solver/adapter/excel_input_v2_entity_reference_adapter.py" = ["RUF001"]
"src/school_timetable_solver/adapter/excel_v2_workbook_adapter.py" = ["I001", "RUF001", "UP035", "F401"]
"src/school_timetable_solver/adapter/excel_v2_workbook_postprocessor.py" = ["UP035", "RUF001"]
"src/school_timetable_solver/adapter/excel_v2_reference_postprocessor.py" = ["I001", "UP035", "RUF001", "RUF012", "RUF059"]
"tests/integration/test_excel_input_v2.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
