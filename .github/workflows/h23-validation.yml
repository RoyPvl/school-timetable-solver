name: H23 validation

on:
  push:
    branches:
      - agent/h23-class-successor

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Sample strict generation
        run: |
          uv run python -m school_timetable_solver.main \
            --input projects/sample/input/時間割入力_サンプル.xlsx \
            --output projects/sample/output/時間割生成結果_H23_CI.xlsx \
            --log projects/sample/output/時間割生成_H23_CI.log \
            --mode strict \
            --max-solve-seconds 60 \
            --random-seed 1 \
            --num-search-workers 1
