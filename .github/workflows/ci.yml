name: CI

on:
  push:
    branches: ["main", "agent/input-excel-v2"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install
        run: |
          python -m pip install uv
          uv sync --locked --extra desktop --python 3.12
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Pyright
        run: uv run --no-sync pyright
      - name: Pytest including desktop lifecycle
        run: uv run --no-sync pytest
