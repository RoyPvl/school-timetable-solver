name: CI

on:
  push:
    branches: ["main", "agent/input-excel-v2"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest ruff pyright
      - name: Ruff
        run: ruff check src tests
      - name: Pyright
        run: pyright
      - name: Pytest
        run: pytest
